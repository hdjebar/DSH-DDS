name: CI & Security Governance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-quality:
    name: Security Scan, Code Quality & Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Syntax Check JavaScript (.mjs) Scripts
        run: |
          set -e
          echo "🔍 Checking Node.js scripts with node --check..."
          for file in $(find config/ -name "*.mjs"); do
            node --check "$file"
            echo "  ✅ Syntax OK: $file"
          done

      - name: Lint Shell Scripts with ShellCheck
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y shellcheck
          echo "🔍 Linting operator shell scripts..."
          shellcheck -e SC1091 -e SC2086 -e SC2181 dsh.sh reset.sh install_dsh.sh
          for sh in $(find config/personas/ -name "workflow.sh"); do
            shellcheck -e SC1091 -e SC2086 "$sh"
            echo "  ✅ ShellCheck OK: $sh"
          done

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Validate Docker Compose Configuration
        run: |
          set -e
          echo "🔍 Validating docker-compose.yml configuration..."
          cp .env.example .env
          docker compose config --quiet
          echo "  ✅ Docker Compose configuration is valid."

      - name: Scan Repository Index for Forbidden Database & Ephemeral Files
        run: |
          set -e
          echo "🔍 Verifying clean git index (no .db or secret files)..."
          if git ls-files | grep -E '\.(db|db-wal|db-shm)$|^\.env$|\.anonymous-user-id'; then
            echo "❌ Error: Forbidden runtime or database files found in git index!"
            exit 1
          fi
          echo "  ✅ Clean: Zero runtime database or secret files in git index."
