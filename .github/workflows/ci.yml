name: CI & Supply-Chain Hardening

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-static-analysis:
    name: Security Scans, Linting & Regression Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Forbidden Files Policy Check
        run: |
          echo "Verifying no secret credentials or unauthorized database files are tracked..."
          FORBIDDEN=$(git ls-files | grep -E '(\.env|\.pem|\.key|\.db|\.sqlite)$' | grep -v '\.env\.example' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "❌ Found forbidden tracked files in git index:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "✅ No sensitive files tracked in git index."

      - name: ShellCheck Linting
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          ignore_paths: 'testinstall'
          severity: warning

      - name: Hadolint Dockerfile Linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3013

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Hermetic Node Dependencies
        run: npm ci

      - name: Shell Syntax Validation
        run: |
          bash -n dsh.sh install_dsh.sh reset.sh

      - name: Node.js Syntax Checks
        run: |
          node --check config/persona.mjs
          node --check config/doctor.mjs
          node --check config/sync_models.mjs
          node --check config/patch_translations.mjs

      - name: Run Node.js Test Suite (CLI, YAML & Parity)
        run: |
          node --test tests/*.test.mjs

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.sandbox.yml config --quiet

  container-build-and-smoke:
    name: Container Build & Offline MCP Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image (No Cache)
        run: |
          docker build --no-cache -t dsh-local:latest .

      - name: Offline MCP Executable & Playwright Chromium Smoke Test (--network none)
        run: |
          echo "Verifying all 4 standalone MCP binaries execute with ZERO network connectivity..."
          docker run --rm --network none --entrypoint github-mcp-server dsh-local:latest --version
          docker run --rm --network none --entrypoint mcp-server-sqlite dsh-local:latest --help
          docker run --rm --network none --entrypoint /bin/sh dsh-local:latest -c "which mcp-server-webresearch context7-mcp github-mcp-server mcp-server-sqlite"

          echo "Verifying Playwright Chromium headless launch and close..."
          docker run --rm --network none --entrypoint node dsh-local:latest -e "
            const { chromium } = require('/usr/local/lib/node_modules/@mzxrai/mcp-webresearch/node_modules/playwright');
            (async () => {
              const browser = await chromium.launch({ headless: true });
              const page = await browser.newPage();
              console.log('✅ Playwright Chromium launched and initialized cleanly offline!');
              await browser.close();
            })();
          "

      - name: Entrypoint Script Syntax Assertion
        run: |
          docker run --rm --entrypoint /bin/sh dsh-local:latest -c "sh -n /usr/local/bin/dsh-entrypoint && sh -n /app/entrypoint.upstream.sh"

      - name: Prebuilt Hidden Dependencies Assertion (.pnpm & .bin)
        run: |
          docker run --rm --entrypoint /bin/sh dsh-local:latest -c "test -d /app/prebuilt-profiles/web/node_modules/.pnpm && test -d /app/prebuilt-profiles/web/node_modules/.bin"

      - name: In-Container Persona Catalog Discovery Assertion
        run: |
          docker run --rm --read-only \
            -e DSH_SANDBOX=1 \
            -e DSH_CONFIG_SOURCE=/opt/dsh-config \
            -e DSH_RUNTIME_DIR=/run/dsh \
            -e DSH_SESSION_STATE_DIR=/var/lib/dsh-state \
            -e DSH_SESSIONS_DIR=/root/.dsh/sessions \
            -v "$PWD/config:/opt/dsh-config:ro" \
            --tmpfs /root/.dsh:rw,nosuid,nodev,size=512m \
            --tmpfs /run:rw,size=32m \
            --tmpfs /var/lib/dsh-state:rw,size=32m \
            dsh-local:latest node /root/.dsh/persona.mjs list | grep -q "sdmx-expert"

      - name: Hardened Sandbox Compose Stack Integration Test
        run: |
          cp .env.example .env
          mkdir -p workspaces

          cleanup() {
            docker compose -f docker-compose.yml -f docker-compose.sandbox.yml down -v
          }
          trap cleanup EXIT

          docker compose -f docker-compose.yml -f docker-compose.sandbox.yml up -d
          
          echo "Waiting for DSH sandbox service to report healthy..."
          healthy=0
          for i in $(seq 1 90); do
            if docker compose -f docker-compose.yml -f docker-compose.sandbox.yml ps dsh | grep -q "healthy"; then
              echo "✅ DSH sandbox container is healthy!"
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            docker compose -f docker-compose.yml -f docker-compose.sandbox.yml ps
            docker compose -f docker-compose.yml -f docker-compose.sandbox.yml logs dsh
            exit 1
          fi
          
          echo "Asserting sandbox read-only mounts..."
          docker compose -f docker-compose.yml -f docker-compose.sandbox.yml exec -T dsh sh -c 'touch /opt/dsh-config/test.txt 2>/dev/null && exit 1 || echo "✅ /opt/dsh-config is read-only"'
          docker compose -f docker-compose.yml -f docker-compose.sandbox.yml exec -T dsh sh -c 'touch /workspaces/test.txt 2>/dev/null && exit 1 || echo "✅ /workspaces is read-only"'

          echo "Asserting zero-egress network isolation..."
          docker compose -f docker-compose.yml -f docker-compose.sandbox.yml exec -T dsh node -e "fetch('https://example.com', { signal: AbortSignal.timeout(2000) }).then(()=>process.exit(1)).catch(()=>process.exit(0))"

          echo "Asserting Phoenix observability connectivity..."
          docker compose -f docker-compose.yml -f docker-compose.sandbox.yml exec -T dsh node -e "fetch('http://phoenix:6006/').then(r=>{ if(r.status===200) process.exit(0); else process.exit(1); })"

          echo "Asserting session state persists across a sandbox restart..."
          docker compose -f docker-compose.yml -f docker-compose.sandbox.yml exec -T dsh sh -c 'echo persisted > /root/.dsh/sessions/ci-marker'
          docker compose -f docker-compose.yml -f docker-compose.sandbox.yml exec -T dsh sh -c 'echo persisted > /root/.dsh/storages/ci-marker'
          docker compose -f docker-compose.yml -f docker-compose.sandbox.yml restart dsh
          healthy=0
          for i in $(seq 1 90); do
            if docker compose -f docker-compose.yml -f docker-compose.sandbox.yml ps dsh | grep -q "healthy"; then
              healthy=1
              break
            fi
            sleep 1
          done
          [ "$healthy" -eq 1 ]
          docker compose -f docker-compose.yml -f docker-compose.sandbox.yml exec -T dsh grep -q persisted /root/.dsh/sessions/ci-marker
          docker compose -f docker-compose.yml -f docker-compose.sandbox.yml exec -T dsh grep -q persisted /root/.dsh/storages/ci-marker
