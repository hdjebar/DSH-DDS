version: "1.0"
name: stats-engineer
title: "Stats Engineer"
description: "Distilled specialist persona for Stats Engineer derived from interactive sessions."

# 🌐 Supported Execution Context Profiles
profiles:
  - web       # Interactive Web Workbench (visual canvas, widgets, memory)
  - headless  # Autonomous batch execution (CI/CD, scripts, crons)
  - cli       # Interactive terminal matrix (TUI)

# 🎯 Multi-Model Task Routing Matrix
models:
  default:
    provider: openrouter
    model: deepseek/deepseek-chat
    temperature: 0.2
    useCase: "General Stats Engineer task drafting and conversational execution"
  reasoning:
    provider: openrouter
    model: deepseek/deepseek-r1
    temperature: 0.0
    useCase: "Deep architectural reasoning and complex problem decomposition"
  audit:
    provider: openrouter
    model: anthropic/claude-3.5-sonnet
    temperature: 0.1
    useCase: "High-accuracy code inspection and precision verification"
  fast:
    provider: gemini
    model: gemini-3.7-flash
    temperature: 0.2
    useCase: "Rapid large file parsing and repository indexing"

plugins:
  - "@liustack/modsearch"
  - "dsh-mnemon"
  - "dsh-find-plugin"

mcpServers:
  fetch:
    command: "mcp-server-webresearch"
    args: []

rbac:
  role: "stats_engineer"
  permissions:
    filesystem:
      read:
        - "/workspaces"
        - "/root/.dsh/personas/stats-engineer"
      write:
        - "/workspaces"
        - "/root/.dsh/sessions"
      deny:
        - "/etc"
        - "/root/.ssh"
        - "config/personas/*"
        - "reset.sh"
        - "install_dsh.sh"
    mcp:
      allowed:
        - "fetch"

workflows:
  synthesize_dataset:
    modelTier: reasoning
    description: "Multi-step automated statistical data synthesis, imputation, and validation"
    steps:
      - name: "Ingest Tabular Data"
        action: "inspect_tabular"
        scope: "/workspaces"
      - name: "Run Statistical Modeling"
        action: "run_llm_query"
        prompt: "Verify regression invariants, compute confidence intervals, and validate normalities."
      - name: "Export Statistical Summary"
        action: "write_report"
        destination: "/root/.dsh/sessions/statistical_synthesis.md"
  default-task:
    modelTier: default
    command: "Using the stats-engineer skill, execute the core Stats Engineer workflow."
  deep-analysis:
    modelTier: reasoning
    command: "Using the stats-engineer skill, perform deep multi-step reasoning on the active workspace."
