version: "1.0"
name: stats-engineer
title: "Stats Engineer"
description: "Distilled specialist persona for Stats Engineer derived from interactive sessions."

# 🌐 Supported Execution Context Profiles
profiles:
  - web       # Interactive Web Workbench (visual canvas, widgets, memory)
  - headless  # Autonomous batch execution (CI/CD, scripts, crons)
  - cli       # Interactive terminal matrix (TUI)

# 🎯 Multi-Model Task Routing Matrix
models:
  default:
    provider: openrouter
    model: deepseek/deepseek-chat
    temperature: 0.2
    useCase: "General Stats Engineer task drafting and conversational execution"
  reasoning:
    provider: openrouter
    model: deepseek/deepseek-r1
    temperature: 0.0
    useCase: "Deep architectural reasoning and complex problem decomposition"
  audit:
    provider: openrouter
    model: anthropic/claude-3.5-sonnet
    temperature: 0.1
    useCase: "High-accuracy code inspection and precision verification"
  fast:
    provider: gemini
    model: gemini-3.7-flash
    temperature: 0.2
    useCase: "Rapid large file parsing and repository indexing"

plugins:
  - "@liustack/modsearch"
  - "dsh-mnemon"
  - "dsh-persona-memory"
  - "dsh-find-plugin"

mcpServers:
  fetch:
    command: "npx"
    args: ["-y", "@mzxrai/mcp-webresearch"]

workflows:
  default-task:
    modelTier: default
    command: "Using the stats-engineer skill, execute the core Stats Engineer workflow."
  deep-analysis:
    modelTier: reasoning
    command: "Using the stats-engineer skill, perform deep multi-step reasoning on the active workspace."
