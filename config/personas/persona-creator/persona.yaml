version: "1.0"
name: persona-creator
title: "AI Persona & Workflow Architect"
description: "Meta-architect persona specializing in interactive workflow design with deepseek-flow visual canvas, multi-model matrix calibration, and 6-layer persona package generation."

# 🌐 Supported Execution Context Profiles
profiles:
  - web       # Interactive Web Workbench (visual canvas, widgets, memory)
  - headless  # Autonomous batch execution (CI/CD, scripts, crons)
  - cli       # Interactive terminal matrix (TUI)

# 🎯 Multi-Model Task Routing Matrix
models:
  default:
    provider: openrouter
    model: deepseek/deepseek-chat
    temperature: 0.2
    useCase: "Interactive requirement gathering, persona interviewing, and prompt drafting"
  reasoning:
    provider: openrouter
    model: deepseek/deepseek-r1
    temperature: 0.0
    useCase: "Deep workflow dependency analysis, Boolean condition gates, and DAG validation"
  audit:
    provider: openrouter
    model: anthropic/claude-3.5-sonnet
    temperature: 0.1
    useCase: "Precision YAML manifest verification and tool signature auditing"
  fast:
    provider: gemini
    model: gemini-3.7-flash
    temperature: 0.2
    useCase: "Rapid session log parsing, repository indexing, and documentation ingestion"

plugins:
  - "deepseek-flow"
  - "dsh-mnemon"
  - "dshmarket"
  - "dsh-find-plugin"

mcpServers:
  fetch:
    command: "mcp-server-webresearch"
    args: []
  context7:
    command: "context7-mcp"
    args: []
  github:
    command: "github-mcp-server"
    args: ["stdio"]

rbac:
  role: "persona_creator"
  permissions:
    filesystem:
      read:
        - "/workspaces"
        - "/root/.dsh/personas/persona-creator"
        - "/root/.dsh/templates"
      write:
        - "/artifacts"
        - "/workspaces/cases"
        - "/root/.dsh/personas"
        - "/root/.dsh/sessions"
      deny:
        - "/etc"
        - "/root/.ssh"
        - "reset.sh"
        - "install_dsh.sh"
    mcp:
      allowed:
        - "fetch"
        - "context7"
        - "github"

workflows:
  generate_declarative_pipeline:
    modelTier: reasoning
    description: "Multi-step automated interactive visual workflow synthesis with deepseek-flow"
    steps:
      - name: "Analyze User Requirements"
        action: "parse_intent"
        scope: "workspace"
      - name: "Generate Visual Canvas Nodes"
        action: "run_llm_query"
        prompt: "Synthesize WORKFLOW.md control graph and step-by-step STEP.md workspaces."
      - name: "Validate Flow Schema"
        action: "write_report"
        destination: "/artifacts/flow.json"
  design-workflow:
    modelTier: reasoning
    command: "Design an interactive visual workflow canvas (WORKFLOW.md and STEP.md) with deepseek-flow."
  build-persona:
    modelTier: audit
    command: "Synthesize and write a complete 6-layer persona package into config/personas/<name>/."
  benchmark:
    modelTier: fast
    command: "Calibrate and rank multi-model routing tiers for persona task execution."
