version: "1.0"
name: security-auditor
title: "Security Auditor & AppSec Specialist"
description: "Specialized in code security reviews, OWASP vulnerability detection, token leak auditing, and dependency scans."

# 🌐 Supported Execution Context Profiles
profiles:
  - web       # Interactive Web Workbench (visual canvas, widgets, memory)
  - headless  # Autonomous batch execution (CI/CD, scripts, crons)
  - cli       # Interactive terminal matrix (TUI)

# 🎯 Multi-Model Task Routing Matrix
models:
  default:
    provider: openrouter
    model: anthropic/claude-3.5-sonnet
    temperature: 0.1
    useCase: "Precision code security auditing, vulnerability verification, and patch generation"
  reasoning:
    provider: openrouter
    model: deepseek/deepseek-r1
    temperature: 0.0
    useCase: "Complex cryptanalysis, threat modeling, and multi-file taint analysis"
  fast:
    provider: openrouter
    model: deepseek/deepseek-chat
    temperature: 0.2
    useCase: "Rapid repository secret scanning and basic linter reviews"
  multimodal:
    provider: gemini
    model: gemini-3.7-flash
    temperature: 0.1
    useCase: "Architecture diagram review and multimodal security documentation inspection"

plugins:
  - "dsh-better-sidebar"
  - "dsh-find-plugin"

mcpServers:
  github:
    command: "github-mcp-server"
    args: ["stdio"]
  fetch:
    command: "mcp-server-webresearch"
    args: []

workflows:
  audit_code:
    modelTier: reasoning
    description: "Multi-step architectural audit and dependency vulnerability scan"
    steps:
      - name: "Discover Workspace Structure"
        action: "fetch_sources"
        scope: "recursive"
        ignore: "node_modules, .git"
      - name: "Scan for Dynamic Patches & Dependencies"
        action: "run_llm_query"
        prompt: "Analyze workspace structure for manual patching scripts (e.g. patch-pi-ai.mjs) and verify structural integrity."
      - name: "Trace Thought Signatures"
        action: "apply_fix_or_patch"
        target: "pi-ai"
        verification: "Ensure thought_signature is captured and structured API returns are preserved cleanly."
      - name: "Export Architecture Mapping Report"
        action: "write_report"
        destination: "/root/.dsh/sessions/security_audit_report.json"
        projection: "domain_entities"
  audit-diff:
    modelTier: default
    command: "Using the security-auditor skill, audit all modified files in git diff HEAD~1 and report security risks with diff patches."
  threat-model:
    modelTier: reasoning
    command: "Using the security-auditor skill, perform deep architectural threat modeling across the codebase."
  scan-secrets:
    modelTier: fast
    command: "Using the security-auditor skill, scan the repository for hardcoded tokens, passwords, and private keys."
