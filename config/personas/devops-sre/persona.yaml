version: "1.0"
name: devops-sre
title: "DevOps & Site Reliability Engineer"
description: "Specialized in Docker container lifecycle, health diagnostics, CI/CD automation, and Phoenix observability."

# 🌐 Supported Execution Context Profiles
profiles:
  - web       # Interactive Web Workbench (visual canvas, widgets, memory)
  - headless  # Autonomous batch execution (CI/CD, scripts, crons)
  - cli       # Interactive terminal matrix (TUI)

# 🎯 Multi-Model Task Routing Matrix
models:
  default:
    provider: openrouter
    model: deepseek/deepseek-chat
    temperature: 0.1
    useCase: "General infrastructure management, health checks, and log inspection"
  reasoning:
    provider: openrouter
    model: deepseek/deepseek-r1
    temperature: 0.0
    useCase: "Root-cause debugging of container crashes, memory leaks, and distributed OTel bottlenecks"
  coding:
    provider: openrouter
    model: anthropic/claude-3.5-sonnet
    temperature: 0.1
    useCase: "Writing production Dockerfiles, compose stacks, and GitHub Actions CI pipelines"
  fast:
    provider: gemini
    model: gemini-3.7-flash
    temperature: 0.2
    useCase: "Fast port scanning, process monitoring, and live status triage"

plugins:
  - "dsh-mcp-panel"
  - "dsh-provider-model-configurator"

mcpServers:
  github:
    command: "github-mcp-server"
    args: ["stdio"]
  fetch:
    command: "mcp-server-webresearch"
    args: []

rbac:
  role: "devops_sre"
  permissions:
    filesystem:
      read:
        - "/workspaces"
        - "/root/.dsh/personas/devops-sre"
      write:
        - "/workspaces"
        - "/root/.dsh/sessions"
      deny:
        - "/etc"
        - "/root/.ssh"
        - "config/personas/*"
        - "reset.sh"
        - "install_dsh.sh"
    mcp:
      allowed:
        - "github"
        - "fetch"

workflows:
  verify_cluster:
    modelTier: reasoning
    description: "Multi-step automated health and observability verification"
    steps:
      - name: "Inspect Container Topology"
        action: "probe_services"
        scope: "docker"
      - name: "Validate Telemetry & Health"
        action: "verify_endpoint"
        target: "http://phoenix:6006"
        verification: "Ensure OTel traces are ingesting without backpressure"
      - name: "Generate SRE Reliability Report"
        action: "write_report"
        destination: "/root/.dsh/sessions/sre_health_report.json"
  doctor:
    modelTier: default
    command: "Using the devops-sre skill, run ./dsh.sh doctor and verify container health, ports, and OTel ingest."
  root-cause:
    modelTier: reasoning
    command: "Using the devops-sre skill, inspect container logs and diagnostics to determine root cause of issues."
  ci-pipeline:
    modelTier: coding
    command: "Using the devops-sre skill, generate a GitHub Actions workflow for building and testing this Docker stack."
