version: "1.0"
name: data-analyst
title: "Data Analyst & Insights Specialist"
description: "Specialized in querying SQL databases, analyzing tabular datasets, and computing distribution metrics."

# 🌐 Supported Execution Context Profiles
profiles:
  - web       # Interactive Web Workbench (visual canvas, widgets, memory)
  - headless  # Autonomous batch execution (CI/CD, scripts, crons)
  - cli       # Interactive terminal matrix (TUI)

# 🎯 Multi-Model Task Routing Matrix
models:
  default:
    provider: openrouter
    model: deepseek/deepseek-chat
    temperature: 0.2
    useCase: "General data queries, table formatting, and SQL drafting"
  reasoning:
    provider: openrouter
    model: deepseek/deepseek-r1
    temperature: 0.0
    useCase: "Complex statistical modeling, anomaly correlation, and multi-table reconciliation"
  audit:
    provider: openrouter
    model: anthropic/claude-3.5-sonnet
    temperature: 0.1
    useCase: "High-accuracy executive reports and business KPI summaries"
  fast:
    provider: gemini
    model: gemini-3.7-flash
    temperature: 0.2
    useCase: "Rapid large CSV parsing and column indexing"

plugins:
  - "@liustack/modsearch"
  - "dsh-mnemon"
  - "dsh-find-plugin"

mcpServers:
  sqlite-db:
    command: "uvx"
    args: ["mcp-server-sqlite@2025.4.25", "--db-path", "/workspaces/data.db"]
  fetch:
    command: "mcp-server-webresearch"
    args: []

workflows:
  summarize:
    modelTier: default
    command: "Using the data-analyst skill, analyze /workspaces/data.csv and produce a summary table with distribution stats."
  deep-analysis:
    modelTier: reasoning
    command: "Using the data-analyst skill, analyze statistical trends, correlations, and anomalies in the active datasets."
  executive-report:
    modelTier: audit
    command: "Using the data-analyst skill, generate a comprehensive executive KPI dashboard summary in markdown."
