version: "1.0"
name: data-analyst
title: "Data Analyst & Insights Specialist"
description: "Specialized in querying SQL databases, analyzing tabular datasets, and computing distribution metrics."

# 🌐 Supported Execution Context Profiles
profiles:
  - web       # Interactive Web Workbench (visual canvas, widgets, memory)
  - headless  # Autonomous batch execution (CI/CD, scripts, crons)
  - cli       # Interactive terminal matrix (TUI)

# 🎯 Multi-Model Task Routing Matrix
models:
  default:
    provider: openrouter
    model: deepseek/deepseek-chat
    temperature: 0.2
    useCase: "General data queries, table formatting, and SQL drafting"
  reasoning:
    provider: openrouter
    model: deepseek/deepseek-r1
    temperature: 0.0
    useCase: "Complex statistical modeling, anomaly correlation, and multi-table reconciliation"
  audit:
    provider: openrouter
    model: anthropic/claude-3.5-sonnet
    temperature: 0.1
    useCase: "High-accuracy executive reports and business KPI summaries"
  fast:
    provider: gemini
    model: gemini-3.7-flash
    temperature: 0.2
    useCase: "Rapid large CSV parsing and column indexing"

plugins:
  - "@liustack/modsearch"
  - "dsh-mnemon"
  - "dsh-find-plugin"

mcpServers:
  sqlite-db:
    command: "mcp-server-sqlite"
    args: ["--db-path", "/workspaces/data.db"]
  fetch:
    command: "mcp-server-webresearch"
    args: []

rbac:
  role: "data_analyst"
  permissions:
    filesystem:
      read:
        - "/workspaces"
        - "/root/.dsh/personas/data-analyst"
      write:
        - "/artifacts"
        - "/workspaces/cases"
        - "/root/.dsh/sessions"
      deny:
        - "/etc"
        - "/root/.ssh"
        - "config/personas/*"
        - "reset.sh"
        - "install_dsh.sh"
        - "config/profiles/*"
    mcp:
      allowed:
        - "sqlite-db"
        - "fetch"

workflows:
  analyze_pipeline:
    modelTier: reasoning
    description: "Multi-step automated data profiling and statistical synthesis"
    steps:
      - name: "Profile Relational Datasets"
        action: "inspect_sqlite"
        scope: "/workspaces/data.db"
      - name: "Evaluate Anomaly Bounds"
        action: "run_llm_query"
        prompt: "Compute outlier distributions, median absolute deviations, and trend trajectories."
      - name: "Export Executive Dashboard"
        action: "write_report"
        destination: "/root/.dsh/sessions/executive_data_summary.md"
  summarize:
    modelTier: default
    command: "Using the data-analyst skill, analyze /workspaces/data.csv and produce a summary table with distribution stats."
  deep-analysis:
    modelTier: reasoning
    command: "Using the data-analyst skill, analyze statistical trends, correlations, and anomalies in the active datasets."
  executive-report:
    modelTier: audit
    command: "Using the data-analyst skill, generate a comprehensive executive KPI dashboard summary in markdown."
