- id: llm-deepseek
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web
  config:
    searchProvider: modsearch
    defaultWorkspacePath: /workspaces
- id: find-dsh-plugin
  config:
    search_paths:
      - /workspaces
    exclude_patterns:
      - "**/node_modules/**"
      - "**/.git/**"
      - "**/.venv/**"
- id: better-sidebar
  config:
    layout: vscode-classic
    persistent_terminal: true
- id: model-sync
  config:
    auto_poll_on_startup: true
    sync_interval_hours: 12
    enable_quota_ui_widget: true
- id: mnemon
  config:
    enable_per_workspace_memory: true
    auto_index_project_briefs: true
- id: session-telemetry-otel
  config:
    mode: !!js process.env.DSH_TELEMETRY_MODE || 'FULL'
    shutdownTimeoutMillis: 3000
    exporter:
      url: !!js process.env.DSH_TELEMETRY_OTLP_URL || 'http://phoenix:6006/v1/traces'
      compression: none
      timeoutMillis: 2000
- id: llm-pi-ai
  config:
    providers:
      gemini:
        apiKeyEnv: GEMINI_API_KEY
        displayName: "Google AI Studio (Gemini)"
        api: openai-completions
        baseURL: "https://generativelanguage.googleapis.com/v1beta/openai"
        models:
          - id: "gemini-3.8-flash"
            name: "Google: Gemini 3.8 Flash"
            contextWindow: 1048576
            maxTokens: 65536
            input: ["text", "image"]
          - id: "gemini-3.7-flash"
            name: "Google: Gemini 3.7 Flash"
            contextWindow: 1048576
            maxTokens: 65536
            input: ["text", "image"]
          - id: "gemini-3.6-flash"
            name: "Google: Gemini 3.6 Flash"
            contextWindow: 1048576
            maxTokens: 65536
            input: ["text", "image"]
          - id: "gemini-3.5-flash"
            name: "Google: Gemini 3.5 Flash"
            contextWindow: 1048576
            maxTokens: 65536
            input: ["text", "image"]
          - id: "gemini-3.5-flash-lite"
            name: "Google: Gemini 3.5 Flash Lite"
            contextWindow: 1048576
            maxTokens: 65536
            input: ["text", "image"]
          - id: "gemini-3.1-pro-preview"
            name: "Google: Gemini 3.1 Pro Preview"
            contextWindow: 1048576
            maxTokens: 65536
            input: ["text", "image"]
          - id: "gemini-flash-latest"
            name: "Google: Gemini Flash (Auto-Updating)"
            contextWindow: 1048576
            maxTokens: 65536
            input: ["text", "image"]
          - id: "gemini-pro-latest"
            name: "Google: Gemini Pro (Auto-Updating)"
            contextWindow: 1048576
            maxTokens: 65536
            input: ["text", "image"]
      openrouter:
        apiKeyEnv: OPENROUTER_API_KEY
        displayName: "OpenRouter"
        api: openai-completions
        baseURL: "https://openrouter.ai/api/v1"
        models:
          - id: "deepseek/deepseek-chat"
            name: "DeepSeek: DeepSeek V3"
            contextWindow: 163840
            maxTokens: 8192
          - id: "deepseek/deepseek-r1"
            name: "DeepSeek: DeepSeek R1"
            contextWindow: 64000
            maxTokens: 8192
          - id: "anthropic/claude-sonnet-5"
            name: "Anthropic: Claude Sonnet 5"
            contextWindow: 200000
            maxTokens: 8192
          - id: "anthropic/claude-opus-5"
            name: "Anthropic: Claude Opus 5"
            contextWindow: 200000
            maxTokens: 8192
          - id: "openai/gpt-6-astra"
            name: "OpenAI: GPT-6 Astra"
            contextWindow: 1050000
            maxTokens: 16384
          - id: "openai/gpt-5.6-luna"
            name: "OpenAI: GPT-5.6 Luna"
            contextWindow: 1050000
            maxTokens: 16384
          - id: "meta-llama/llama-3.3-70b-instruct"
            name: "Meta: Llama 3.3 70B Instruct"
            contextWindow: 131072
            maxTokens: 8192
          - id: "google/gemini-3.8-flash"
            name: "OpenRouter: Google Gemini 3.8 Flash"
            contextWindow: 1048576
            maxTokens: 65536
- id: agent-default-model
  config:
    provider: openrouter
    model: deepseek/deepseek-chat

