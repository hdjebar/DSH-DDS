- id: llm-deepseek
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web
  config:
    searchProvider: modsearch
    defaultWorkspacePath: /workspaces
- id: find-dsh-plugin
  config:
    search_paths:
      - /workspaces
    exclude_patterns:
      - "**/node_modules/**"
      - "**/.git/**"
      - "**/.venv/**"
- id: better-sidebar
  config:
    layout: vscode-classic
    persistent_terminal: true
- id: model-sync
  config:
    auto_poll_on_startup: true
    sync_interval_hours: 12
    enable_quota_ui_widget: true
- id: mnemon
  config:
    enable_per_workspace_memory: true
    auto_index_project_briefs: true
- id: llm-pi-ai
  config:
    providers:
      gemini:
        apiKeyEnv: GEMINI_API_KEY
        displayName: "Google AI Studio (Gemini)"
        api: openai-completions
        baseURL: "https://generativelanguage.googleapis.com/v1beta/openai"
        models:
          - id: "gemini-2.0-flash"
            name: "Google: Gemini 2.0 Flash"
            contextWindow: 1048576
            maxTokens: 8192
            input: ["text", "image"]
          - id: "gemini-2.5-flash"
            name: "Google: Gemini 2.5 Flash"
            contextWindow: 1048576
            maxTokens: 8192
            input: ["text", "image"]
      openrouter:
        apiKeyEnv: OPENROUTER_API_KEY
        displayName: "OpenRouter"
        api: openai-completions
        baseURL: "https://openrouter.ai/api/v1"
        models:
          - id: "deepseek/deepseek-chat"
            name: "DeepSeek: DeepSeek V3"
            contextWindow: 65536
            maxTokens: 8192
          - id: "google/gemini-2.5-flash"
            name: "OpenRouter: Gemini 2.5 Flash"
            contextWindow: 1048576
            maxTokens: 8192
          - id: "openai/gpt-4o"
            name: "OpenAI: GPT-4o"
            contextWindow: 128000
            maxTokens: 4096
          - id: "anthropic/claude-3.5-sonnet"
            name: "Anthropic: Claude 3.5 Sonnet"
            contextWindow: 200000
            maxTokens: 8192
- id: agent-default-model
  config:
    provider: openrouter
    model: deepseek/deepseek-chat

