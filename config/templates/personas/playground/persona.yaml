version: "1.0"
name: playground
title: "Playground & Harness Engineering Specialist"
description: "Specialized in rapid experimentation, multi-model evaluation, plugin lifecycles, MCP tool exploration, workflow orchestration, and dynamic skill authoring in a contained playground workspace sandbox."

# 🌐 Supported Execution Context Profiles
profiles:
  - web       # Interactive Web Workbench (visual canvas, widgets, memory)
  - headless  # Autonomous batch execution (CI/CD, scripts, crons)
  - cli       # Interactive terminal matrix (TUI)
  - sandbox   # Hardened kernel isolation overlay

# 🎯 Multi-Model Task Routing Matrix
models:
  default:
    provider: openrouter
    model: deepseek/deepseek-chat
    temperature: 0.1
    useCase: "Rapid experimentation, prompt drafting, and interactive queries"
  reasoning:
    provider: openrouter
    model: deepseek/deepseek-r1
    temperature: 0.0
    useCase: "Complex multi-step workflow logic, evaluation benchmarks, and synthesis"
  fast:
    provider: openrouter
    model: deepseek/deepseek-chat
    temperature: 0.2
    useCase: "High-speed syntax triage, JSON parsing, and rapid prototyping"
  multimodal:
    provider: gemini
    model: gemini-2.5-flash
    temperature: 0.2
    useCase: "Multimodal documentation inspection, architecture diagrams, and screenshot evaluation"

plugins:
  - "dshmarket"
  - "dsh-find-plugin"
  - "dsh-mcp-market"
  - "dsh-mcp-panel"
  - "dsh-mnemon"
  - "dsh-model-sync"
  - "dsh-provider-model-configurator"
  - "dsh-session-reader"
  - "deepseek-flow"
  - "dsh-better-sidebar"
  - "@liustack/modsearch"

mcpServers:
  fetch:
    command: "mcp-server-webresearch"
    args: []
  context7:
    command: "context7-mcp"
    args: []
  github:
    command: "github-mcp-server"
    args: []
  sqlite-db:
    command: "mcp-server-sqlite"
    args: ["--db-path", "/var/lib/dsh/storages/data.db"]
  agentkey:
    url: "https://api.agentkey.app/v1/mcp"

rbac:
  role: "playground_engineer"
  permissions:
    filesystem:
      read:
        - "/workspaces"
        - "/var/lib/dsh"
        - "/var/lib/dsh-state"
        - "/root/.dsh"
        - "/artifacts"
      write:
        - "/workspaces/playground"
        - "/workspaces/cases"
        - "/artifacts"
        - "/var/lib/dsh/profiles"
        - "/var/lib/dsh/sessions"
        - "/var/lib/dsh/storages"
        - "/var/lib/dsh-state/sessions"
        - "/var/lib/dsh-state/storages"
        - "/root/.dsh/profiles"
        - "/root/.dsh/sessions"
        - "/root/.dsh/storages"
      deny:
        - "/etc"
        - "/root/.ssh"
        - "config/personas/*"
        - "reset.sh"
        - "install_dsh.sh"
    mcp:
      allowed:
        - "fetch"
        - "github"
        - "context7"
        - "sqlite-db"
        - "agentkey"

workflows:
  author_skill:
    modelTier: reasoning
    description: "Draft, validate YAML frontmatter, and save a new agent skill"
    steps:
      - name: "Fetch Skill Requirements"
        action: "fetch_sources"
        target: "/workspaces/cases"
      - name: "Synthesize Skill Guidelines"
        action: "run_llm_query"
        target: "/artifacts/skills"
      - name: "Export Active Skill"
        action: "write_report"
        destination: "/artifacts/skills/draft_skill.md"
  manage_plugin_lifecycle:
    modelTier: default
    description: "Discover, audit, test, and manage plugin lifecycles within playground profile"
    steps:
      - name: "Inspect Active Plugins"
        action: "fetch_sources"
        target: "/var/lib/dsh/profiles/web/package.json"
      - name: "Audit Plugin Manifest"
        action: "parse_intent"
        target: "/artifacts/plugins/audit_report.json"
      - name: "Generate Plugin Inventory Report"
        action: "write_report"
        destination: "/artifacts/plugins/inventory.md"
  evaluate_mcp_pipeline:
    modelTier: reasoning
    description: "Execute and benchmark multi-tool MCP pipeline across research, code intelligence, and structured data"
    steps:
      - name: "Research Remote Ecosystem"
        action: "fetch_sources"
        target: "/workspaces/playground"
      - name: "Query Structured Database"
        action: "inspect_sqlite"
        scope: "/var/lib/dsh/storages/data.db"
      - name: "Synthesize Benchmark Artifact"
        action: "write_report"
        destination: "/artifacts/mcp_benchmark.md"
  diagnose_environment:
    modelTier: default
    command: "Using the playground skill, diagnose container health, active model catalog, and verify reachability of all 5 MCP servers (including AgentKey)."
  prototype_and_evaluate:
    modelTier: default
    command: "Using the playground skill, prototype a solution in /workspaces/playground and evaluate test results."
  benchmark_routing:
    modelTier: reasoning
    command: "Using the playground skill, benchmark response quality across default, reasoning, and multimodal model tiers."
