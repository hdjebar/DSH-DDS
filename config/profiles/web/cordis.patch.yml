# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: webserver
  inject: [webStartup]
  config:
    host: 0.0.0.0
    port: !!js Number(process.env.PORT ?? 3080)
- id: settings
  config:
    path: /var/lib/dsh/storages/settings.yaml
- id: sub-model-access
  disabled: true
- id: bash-sandbox
  disabled: true
- insert:
    - id: dsh-dds-isolated-shell
      name: '@dsh-dds/core/isolated-shell-executor'
      config:
        socketPath: /run/dsh-executor/executor.sock
        cwd: /workspaces/cases
        timeoutMs: 60000
        maxTimeoutMs: 120000
        maxOutputBytes: 65536
- id: model-sync
  disabled: false
- insert:
    - id: dsh-dds-core
      name: '@dsh-dds/core'
      config:
        enableToolRbac: true
        modelSyncIntervalHours: 12
# --- dsh-mcp-market managed (auto-generated; do not edit) ---
- insert:
    - id: mcp-fetch
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: fetch
        transport: stdio
        command: mcp-server-webresearch
        args: []
- insert:
    - id: mcp-context7
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: context7
        transport: stdio
        command: context7-mcp
        args: []
- insert:
    - id: mcp-github
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: github
        transport: stdio
        command: github-mcp-server
        args:
          - stdio
- insert:
    - id: mcp-sqlite-db
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: sqlite-db
        transport: stdio
        command: mcp-server-sqlite
        args:
          - --db-path
          - /var/lib/dsh/storages/data.db
# --- end dsh-mcp-market managed ---
