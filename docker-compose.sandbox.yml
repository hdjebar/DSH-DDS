# ── Hardened Sandbox Runtime Override for Untrusted Code Evaluation ──
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.sandbox.yml up -d
#
# Provides strict process containment, capability stripping (cap_drop: ALL),
# read-only workspace containment (:ro), resource constraints (CPU/memory/pids limits),
# and zero-egress internal networking (internal: true) to prevent data exfiltration.

services:
  dsh:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
          pids: 150
        reservations:
          cpus: '0.5'
          memory: 512M
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,noexec,nosuid,size=16m
      - /root/.cache:rw,noexec,nosuid,size=128m
    volumes:
      # Read-only workspace mounting prevents untrusted code from modifying host files
      - ${DSH_WORKSPACE_ROOT:-./workspaces}:/workspaces:ro
    networks:
      - sandbox-net

  phoenix:
    networks:
      - sandbox-net

networks:
  sandbox-net:
    driver: bridge
    internal: true
