# ── Hardened Sandbox Runtime Override for Untrusted Code Evaluation ──
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.sandbox.yml up -d
#
# Provides strict process containment, capability stripping (cap_drop: ALL),
# read-only host configuration and workspace containment (:ro), read-only root filesystem,
# resource constraints (CPU/memory/pids limits), and zero-trust filtered egress via Envoy proxy sidecar.

services:
  dsh:
    read_only: true
    user: "${DSH_UID:-1000}:${DSH_GID:-1000}"
    runtime: "${DSH_SANDBOX_RUNTIME:-runc}"
    security_opt: !override
      - no-new-privileges:true
    cap_drop: !override
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
          pids: 150
        reservations:
          cpus: '0.5'
          memory: 512M
    volumes: !override
      # Configuration is copied into disposable tmpfs; session data persists in dedicated named volume.
      # No host bind for /var/lib/dsh/audit: an untrusted workload must not be able to
      # rewrite its own authorization record on the host. The in-sandbox audit file is a
      # tmpfs buffer only; the durable copy is the OTel span export to the phoenix container.
      - ./config:/opt/dsh-config:ro
      - ${DSH_WORKSPACE_ROOT:-./workspaces}:/workspaces:ro
      - sandbox-session-state:/var/lib/dsh-state:rw
    tmpfs:
      - /tmp:rw,size=64m,mode=1777
      - /run:rw,size=32m,mode=0770,uid=1000,gid=1000
      - /home/dsh/.cache:rw,size=128m,mode=0770,uid=1000,gid=1000
      - /home/dsh/.mnemon:rw,size=32m,mode=0770,uid=1000,gid=1000
      - /var/lib/dsh:rw,nosuid,nodev,size=512m,mode=0770,uid=1000,gid=1000
      - /root/.dsh:rw,nosuid,nodev,size=64m,mode=0770,uid=1000,gid=1000
      - /var/log/dsh:rw,nosuid,nodev,size=32m,mode=0750,uid=1000,gid=1000
      - /workspaces/cases:rw,size=64m,mode=0770,uid=1000,gid=1000
      - /artifacts:rw,size=64m,mode=0770,uid=1000,gid=1000
    environment:
      - DSH_SANDBOX=1
      - DSH_CONFIG_SOURCE=/opt/dsh-config
      - DSH_RUNTIME_DIR=/run/dsh
      - DSH_SESSION_STATE_DIR=/var/lib/dsh-state
      - DSH_SESSIONS_DIR=/var/lib/dsh/sessions
      - DSH_DISABLE_MODEL_SYNC=1
      - OPENROUTER_API_KEY=
      - GEMINI_API_KEY=
      - TAVILY_API_KEY=
      - FIRECRAWL_API_KEY=
      - EXA_API_KEY=
      - GITHUB_PERSONAL_ACCESS_TOKEN=
      - GITHUB_TOKEN=
      - PHOENIX_API_KEY=
      - PHOENIX_SECRET=
      - HTTP_PROXY=http://egress-filter:10000
      - HTTPS_PROXY=http://egress-filter:10000
      - NO_PROXY=localhost,127.0.0.1,phoenix,dsh
    networks:
      - dsh-internal

  phoenix:
    user: "${DSH_UID:-1000}:${DSH_GID:-1000}"
    security_opt: !override
      - no-new-privileges:true
    cap_drop: !override
      - ALL
    networks:
      - dsh-internal

  egress-filter:
    image: envoyproxy/envoy:v1.31-latest@sha256:caa5b411be1633b90023592a34a7e010c933d6e60206c758f631485e53006865
    container_name: dsh-egress-filter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    volumes:
      - ./config/network/envoy-egress.yaml:/etc/envoy/envoy.yaml:ro
    networks:
      - dsh-internal
      - dsh-egress-net

volumes:
  sandbox-session-state:
    driver: local

networks:
  dsh-internal:
    driver: bridge
    internal: true
  dsh-egress-net:
    driver: bridge
