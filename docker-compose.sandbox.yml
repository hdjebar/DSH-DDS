# ── Hardened Sandbox Runtime Override for Untrusted Code Evaluation ──
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.sandbox.yml up -d
#
# Provides strict process containment, capability stripping (cap_drop: ALL),
# read-only host configuration and workspace containment (:ro), read-only root filesystem,
# resource constraints (CPU/memory/pids limits), and zero-egress internal networking (internal: true).

services:
  dsh:
    read_only: true
    user: "${DSH_UID:-1000}:${DSH_GID:-1000}"
    security_opt: !override
      - no-new-privileges:true
    cap_drop: !override
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
          pids: 150
        reservations:
          cpus: '0.5'
          memory: 512M
    volumes: !override
      # Configuration is copied into disposable tmpfs; session data persists on host.
      - ./config:/opt/dsh-config:ro
      - ${DSH_WORKSPACE_ROOT:-./workspaces}:/workspaces:ro
      - sandbox-session-state:/var/lib/dsh-state
      - ./config/sessions:/var/lib/dsh-state/sessions:rw
    tmpfs:
      - /tmp:rw,size=64m,mode=1777
      - /run:rw,size=32m,mode=1777
      - /home/dsh/.cache:rw,size=128m,mode=1777
      - /home/dsh/.mnemon:rw,size=32m,mode=1777
      - /var/lib/dsh:rw,nosuid,nodev,size=512m,mode=1777
      - /root/.dsh:rw,nosuid,nodev,size=64m,mode=1777
      - /var/log/dsh:rw,nosuid,nodev,size=32m,mode=1777
      - /workspaces/cases:rw,size=64m,mode=1777
      - /artifacts:rw,size=64m,mode=1777
    environment:
      - DSH_SANDBOX=1
      - DSH_CONFIG_SOURCE=/opt/dsh-config
      - DSH_RUNTIME_DIR=/run/dsh
      - DSH_SESSION_STATE_DIR=/var/lib/dsh-state
      - DSH_SESSIONS_DIR=/var/lib/dsh/sessions
      - DSH_DISABLE_MODEL_SYNC=1
      - HTTP_PROXY=http://egress-filter:10000
      - HTTPS_PROXY=http://egress-filter:10000
      - NO_PROXY=localhost,127.0.0.1,phoenix,dsh
    networks:
      - dsh-internal

  phoenix:
    user: "${DSH_UID:-1000}:${DSH_GID:-1000}"
    security_opt: !override
      - no-new-privileges:true
    cap_drop: !override
      - ALL
    networks:
      - dsh-internal

  egress-filter:
    image: envoyproxy/envoy:v1.31-latest
    container_name: dsh-egress-filter
    restart: unless-stopped
    volumes:
      - ./config/network/envoy-egress.yaml:/etc/envoy/envoy.yaml:ro
    networks:
      - dsh-internal
      - dsh-egress-net

volumes:
  sandbox-session-state:

networks:
  dsh-internal:
    driver: bridge
    internal: true
  dsh-egress-net:
    driver: bridge
