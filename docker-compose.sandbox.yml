# ── Hardened Sandbox Runtime Override for Untrusted Code Evaluation ──
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.sandbox.yml up -d
#
# Provides strict process containment, capability stripping (cap_drop: ALL),
# read-only host configuration and workspace containment (:ro), read-only root filesystem,
# resource constraints (CPU/memory/pids limits), and zero-egress internal networking (internal: true).

services:
  dsh:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
          pids: 150
        reservations:
          cpus: '0.5'
          memory: 512M
    volumes:
      # Read-only configuration and workspace mounting prevents untrusted code from modifying host files
      - ./config:/root/.dsh:ro
      - ${DSH_WORKSPACE_ROOT:-./workspaces}:/workspaces:ro
      - sandbox-profiles:/root/.dsh/profiles
      - sandbox-storages:/root/.dsh/storages
    tmpfs:
      - /tmp:rw,size=64m
      - /run:rw,size=32m
      - /root/.cache:rw,size=128m
      - /root/.mnemon:rw,size=32m
      - /root/.dsh/patch:rw,size=16m
      - /root/.dsh/sessions:rw,size=32m
    environment:
      - DSH_RUNTIME_DIR=/run/dsh
      - DSH_DISABLE_MODEL_SYNC=1
    networks:
      - sandbox-net

  phoenix:
    networks:
      - sandbox-net

volumes:
  sandbox-profiles:
  sandbox-storages:

networks:
  sandbox-net:
    driver: bridge
    internal: true
