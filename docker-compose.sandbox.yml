# ── Hardened Sandbox Runtime Override for Untrusted Code Evaluation ──
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.sandbox.yml up -d
#
# Provides strict process containment, non-root execution, capability stripping,
# read-only mounts, and isolated networking.

services:
  dsh:
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
          pids: 150
        reservations:
          cpus: '0.5'
          memory: 512M
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,noexec,nosuid,size=16m
      - /root/.dsh/patch:rw,noexec,nosuid,size=16m
    volumes:
      # Read-only configuration and workspace mounting to prevent host tampering
      - ./config:/root/.dsh:ro
      - ${DSH_WORKSPACE_ROOT:-./workspaces}:/workspaces:ro
    networks:
      - sandbox-net

networks:
  sandbox-net:
    driver: bridge
    internal: true
